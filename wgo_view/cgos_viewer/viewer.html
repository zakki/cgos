<!doctype html>
<html>
	<head>
		<!-- Responsive viewport for touch devices -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>sgf viewer</title>
		<script type="text/javascript" src="/wgo/wgo.min.js"></script>
		<script type="text/javascript" src="/wgo/wgo.player.min.js"></script>
		<script type="text/javascript" src="/js/pako.js"></script>
		<script type="text/javascript" src="/js/viewer_inner.js"></script>
		<script type="text/javascript" src="/js/viewer.js"></script>
		<link type="text/css" href="/wgo/wgo.player.css" rel="stylesheet" />
	</head>
	<body>
		<div id="cgoswgo" style="width: 700px">
			Sorry, your browser doesn't support WGo.js.
		</div>

		<input type="checkbox" id="update" name="horns" checked />
		<label for="update">Automatic reload</label>

		<!-- Touch Mode Toggle -->
		<input type="checkbox" id="touchmode" name="touchmode" />
		<label for="touchmode">Touch Mode</label>

		<a id="sgflink">Download SGF</a>.

		<!-- Stone Style Selector -->
		<label for="stone-style">Stone Style:</label>
		<select id="stone-style" name="stone-style">
			<option value="SHELL">Shell</option>
			<option value="REALISTIC">Realistic</option>
			<option value="GLOW">Glow</option>
			<option value="PAINTED">Painted</option>
			<option value="MONO">Mono</option>
		</select>
	</body>
</html>
